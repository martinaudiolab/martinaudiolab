<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Request a Restoration - Martin Audio Labs</title><meta name="description" content="Request a restoration from Martin Audio Labs"><link rel="stylesheet" href="style.css"></head><body><header class="site"><a class="brand" href="index.html">Martin Audio Labs</a><nav><a href="index.html">Home</a><a href="shop/index.html">Shop</a><a href="request.html" class="on" aria-current="page">Request a Restoration</a><div class="dd"><button class="dd-toggle" type="button" aria-haspopup="true" aria-expanded="false">Restoration Blog</button><div class="dd-menu"><a href="stereo/index.html">Stereo Repair</a><a href="radio/index.html">Radio Repair</a><a href="test-equipment/index.html">Test Equipment</a></div></div><a href="about.html">About Me</a><button class="theme" type="button" id="th">Theme</button></nav></header><main><div class="request-wrap"><h1 class="h2" style="font-size:2rem">Request a Restoration</h1><p class="intro">Have a unit that needs attention? Send me the details and I will get back to you.</p><form class="request-form" id="request-form" action="https://formspree.io/f/mgaoyoql" method="POST" data-success="Thanks — I&#39;ll get back to you within 1-2 business days."><div class="field"><label for="req-name">Name</label><input type="text" id="req-name" name="name" required placeholder="Your name" autocomplete="name"></div><div class="field"><label for="req-email">Email</label><input type="email" id="req-email" name="email" required placeholder="you@example.com" autocomplete="email"></div><div class="field"><label for="req-model">Unit Model Number</label><input type="text" id="req-model" name="unit_model" required placeholder="e.g. Zenith 6D221, Sansui AU-9000, Marantz 2230S"></div><div class="field"><label for="req-description">Description of unit</label><textarea id="req-description" name="description" rows="6" required placeholder
